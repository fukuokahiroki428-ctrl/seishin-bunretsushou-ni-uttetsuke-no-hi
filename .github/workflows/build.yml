name: Windows Build (Predormition)

# Mac 에서 코드 작성 → git push → 이 workflow 가 GitHub 의 Windows 서버에서 자동 빌드.
# 결과 .exe + DLL + 도구가 zip 으로 Artifacts 에 올라감. Actions 탭에서 다운로드.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]     # ★ v* 태그 push 시 빌드 + GitHub Release 발행
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼
    inputs:
      runner:
        description: '빌드 러너 (windows-2022 은퇴 시 windows-2025 등으로 바꿔 재시도)'
        required: false
        default: 'windows-2022' 

# ★ Node.js 20 deprecation 대응 — JS 액션(checkout/upload-artifact/msvc-dev-cmd)을
#   Node 24 로 강제 실행 → "Node.js 20 actions are deprecated" 경고 제거 + 6/2 강제전환 대비.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    # ★ windows-latest 는 6/15 부터 windows-2025-vs2026 (VS 2026) 로 자동 변경됨.
    #   Qt 6.7.3 msvc2019_64 프리빌드 라이브러리는 VS 2022 까지만 ABI 검증돼 있어서
    #   VS 2026 으로 갑자기 바뀌면 링킹 깨질 수 있음 → 명시적으로 windows-2022 핀.
    # ★ 러너 이미지는 GitHub 이 주기적으로 은퇴시킨다(windows-2019 는 2025-06 은퇴).
    #   은퇴하면 잡이 스케줄조차 안 되고 실패하므로, 코드 수정 없이 갈아탈 수 있게 입력으로 뺐다.
    #   수동 실행(Run workflow) 시 runner 를 windows-2025 등으로 지정하면 그대로 시도한다.
    #   기본값을 바꿀 때는 Qt 프리빌드의 MSVC ABI 호환을 먼저 확인할 것(아래 Install Qt 주석 참고).
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    permissions:
      contents: write   # ★ 태그 push 시 GITHUB_TOKEN 으로 Release 생성/자산 업로드

    # ★ 이 워크플로는 레포 루트(.github/workflows)에 있지만 Windows 프로젝트는 windows/ 하위에 있다.
    #   모든 shell(run) 스텝을 windows/ 에서 실행 → 내부 상대경로(resources, predormition.iss, build_win 등)가 그대로 맞음.
    #   (uses: 스텝은 working-directory 를 무시 → checkout 은 루트, 아티팩트 path 는 windows/ 접두어로 지정.)
    defaults:
      run:
        working-directory: windows

    steps:
      # 1) 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Qt 6.7 + WebEngine 설치
      #    ★ 6.7.3 의 MSVC 데스크탑 arch 는 win64_msvc2019_64 (Qt 명명 규칙 — 실제로는 VS2022 로 빌드 가능).
      #      win64_msvc2022_64 는 6.7.3 에 존재하지 않아 "packages not found" 로 실패함.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning'
          # aqt Qt 6.7.3 는 Qt 모듈 private(Qt6GuiPrivate 등)를 안 담는다 → QXlsx 는
          # third_party/qtzip 의 vendored QZip 헤더 + Qt6::GuiPrivate shim 으로 빌드(CMakeLists 참고).
          cache: true

      # 3) Windows 용 외부 도구 다운로드 (yt-dlp / ffmpeg / ffprobe / rclone / deno)
      #    repo 에는 .exe 안 올림 (.gitignore) → 빌드 시 최신 버전 받음
      - name: Download Windows tools
        shell: pwsh
        run: |
          $tools = "resources/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          # ★ 무결성 검증 — 예전엔 받은 파일을 그대로 번들해서, 미러가 오염되거나 중간에
          #   끊겨도 알 수 없었다(체크섬 검증이 저장소 전체에 0건이었다).
          #   공식 체크섬을 제공하는 도구는 대조하고, 없는 것은 최소한 형식·크기를 본다.
          function Assert-Sha256($file, $expected, $name) {
            $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($got -ne $expected.ToLower()) {
              throw "$name 체크섬 불일치 — 받은 파일이 손상됐거나 변조됐습니다`n  기대: $expected`n  실제: $got"
            }
            Write-Host "  ✔ $name 체크섬 확인"
          }
          # 체크섬 파일 형식이 배포처마다 다르다:
          #   표준 sha256sum : "<64hex>  파일명"
          #   deno           : PowerShell Format-List ("Hash      : <64HEX>")
          #   → 형식을 가리지 않고 첫 64자리 hex 를 해시로 본다.
          # ★ GitHub 은 체크섬 파일을 octet-stream 으로 주기도 한다 → .Content 가 byte[] 가 되어
          #   정규식이 통째로 실패했다(그래서 '해석 못 함'으로 조용히 검증이 생략됐다).
          #   파일로 받아 텍스트로 읽으면 형식·인코딩과 무관하게 안전하다.
          function Fetch-Text($url) {
            $tmp = [System.IO.Path]::GetTempFileName()
            try {
              Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing -MaximumRedirection 10
              return (Get-Content -Raw -Encoding UTF8 $tmp)
            } finally { Remove-Item $tmp -Force -ErrorAction SilentlyContinue }
          }
          function Get-Sha256FromText($text) {
            $m = [regex]::Match($text, '(?i)\b[0-9a-f]{64}\b')
            if ($m.Success) { return $m.Value } else { return $null }
          }
          function Assert-Zip($file, $name) {
            $fs = [System.IO.File]::OpenRead((Resolve-Path $file))
            $sig = New-Object byte[] 2; $null = $fs.Read($sig,0,2); $fs.Close()
            if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) { throw "$name 이 ZIP 이 아닙니다(안내페이지/오류페이지를 받았을 수 있음)" }
          }

          # yt-dlp — 공식 SHA2-256SUMS 로 검증(릴리스마다 함께 배포된다)
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$tools/yt-dlp.exe"
          $ytExpect = $null
          try {
            $sums = Fetch-Text "https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS"
            $line = ($sums -split "`n" | Where-Object { $_ -match '(?i)\syt-dlp\.exe\s*$' } | Select-Object -First 1)
            if ($line) { $ytExpect = Get-Sha256FromText $line }
          } catch { Write-Host "  ⚠ yt-dlp 체크섬 조회 실패(검증 생략): $($_.Exception.Message)" }
          # ★ 조회 실패는 경고로 넘어가지만, 값을 얻었는데 다르면 빌드를 세운다(오염 차단).
          if ($ytExpect) { Assert-Sha256 "$tools/yt-dlp.exe" $ytExpect "yt-dlp" }
          else { Write-Host "  ⚠ yt-dlp 체크섬 항목을 찾지 못함(검증 생략)" }

          # ffmpeg + ffprobe — gyan.dev 우선, 죽어 있으면 BtbN(GitHub) 미러로 폴백.
          #   ★ gyan.dev 는 간헐적으로 503(NFSN Error) 을 내며 빌드를 통째로 깨뜨린 적이 있다.
          $ffSources = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          )
          $ffOk = $false
          foreach ($url in $ffSources) {
            try {
              Write-Host "ffmpeg 다운로드 시도: $url"
              Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -MaximumRedirection 5
              Remove-Item "ffmpeg_tmp" -Recurse -Force -ErrorAction SilentlyContinue
              Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
              $ffExe = Get-ChildItem -Path "ffmpeg_tmp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
              $fpExe = Get-ChildItem -Path "ffmpeg_tmp" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
              if ($ffExe -and $fpExe) {
                Copy-Item $ffExe.FullName "$tools/ffmpeg.exe"  -Force
                Copy-Item $fpExe.FullName "$tools/ffprobe.exe" -Force
                $ffOk = $true; Write-Host "  → 성공"; break
              }
              Write-Host "  → 압축 안에 ffmpeg/ffprobe 없음, 다음 소스 시도"
            } catch { Write-Host "  → 실패: $($_.Exception.Message)" }
          }
          if (-not $ffOk) { throw "ffmpeg 를 어느 소스에서도 받지 못했습니다" }

          # rclone — 버전을 고정했으므로 체크섬도 고정해서 대조한다(공식 SHA256SUMS 값)
          Invoke-WebRequest -Uri "https://github.com/rclone/rclone/releases/download/v1.74.2/rclone-v1.74.2-windows-amd64.zip" -OutFile "rclone.zip"
          Assert-Zip "rclone.zip" "rclone"
          Assert-Sha256 "rclone.zip" "71f376f47428bd467bf92e8bfe7fb36f4c108a4fc4edd3df30fc74dd409c7eef" "rclone v1.74.2"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone_tmp" -Force
          $rc = Get-ChildItem -Path "rclone_tmp" -Directory | Select-Object -First 1
          Copy-Item "$($rc.FullName)/rclone.exe" "$tools/rclone.exe" -Force

          # exiftool — EXIF 메타데이터 기록(작가·설명·촬영일). 없으면 이 기능만 조용히 빠진다.
          #   ★ 배포처 주의(실측으로 확인함):
          #     - GitHub 저장소 zip 은 Perl 소스라 .exe 가 없다
          #     - exiftool.org 는 버전별 zip 을 직접 두지 않고(구버전은 404) 링크만 제공
          #     - SourceForge 는 자동화 요청에 HTML 안내페이지를 돌려줘 zip 이 아니다
          #     → exiftool.org 가 안내하는 oliverbetz.de 미러가 실제 ZIP 을 준다. SF 는 폴백.
          #   ★ 버전은 ver.txt 로 조회해 조립 — 하드코딩하면 구버전 정리 시 404 가 된다.
          $exifOk = $false
          try {
            $exVer = (Invoke-WebRequest -Uri "https://exiftool.org/ver.txt" -UseBasicParsing).Content.Trim()
            Write-Host "exiftool 최신 버전: $exVer"
            $exSources = @(
              "https://oliverbetz.de/cms/files/Artikel/ExifTool-for-Windows/exiftool-${exVer}_64.zip",
              "https://sourceforge.net/projects/exiftool/files/exiftool-${exVer}_64.zip/download"
            )
            foreach ($u in $exSources) {
              try {
                Write-Host "  시도: $u"
                Invoke-WebRequest -Uri $u -OutFile "exiftool.zip" -MaximumRedirection 10 -UserAgent "Mozilla/5.0"
                # 받은 것이 진짜 ZIP 인지 확인 — HTML 안내페이지를 받아놓고 성공으로 오인하지 않게
                $fs = [System.IO.File]::OpenRead("$PWD\exiftool.zip")
                $sig = New-Object byte[] 2; $null = $fs.Read($sig, 0, 2); $fs.Close()
                if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) { Write-Host "    → ZIP 이 아님(안내페이지?) — 다음 소스"; continue }
                Remove-Item "exiftool_tmp" -Recurse -Force -ErrorAction SilentlyContinue
                Expand-Archive -Path "exiftool.zip" -DestinationPath "exiftool_tmp" -Force
                # 실행파일 이름은 배포처마다 다르다: ExifTool.exe / exiftool(-k).exe → exiftool.exe 로 통일
                $ex = Get-ChildItem -Path "exiftool_tmp" -Filter "exiftool*.exe" -Recurse | Select-Object -First 1
                if ($ex) {
                  Copy-Item $ex.FullName "$tools/exiftool.exe" -Force
                  $exFiles = Get-ChildItem -Path "exiftool_tmp" -Filter "exiftool_files" -Directory -Recurse | Select-Object -First 1
                  if ($exFiles) { Copy-Item $exFiles.FullName "$tools/exiftool_files" -Recurse -Force }
                  $exifOk = $true
                  Write-Host "    → exiftool $exVer 설치됨 (Perl 런타임 포함: $([bool]$exFiles))"
                  break
                }
                Write-Host "    → 압축 안에 실행파일 없음 — 다음 소스"
              } catch { Write-Host "    → 실패: $($_.Exception.Message)" }
            }
          } catch { Write-Host "  → exiftool 버전 조회 실패: $($_.Exception.Message)" }
          if (-not $exifOk) { Write-Host "WARN: exiftool 없음 — EXIF 메타데이터 기록 기능만 비활성(빌드는 계속)" }

          # deno — yt-dlp 의 JS 런타임 (YouTube 추출에 필수, 없으면 일부 포맷 누락)
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Assert-Zip "deno.zip" "deno"
          $dnExpect = $null
          try {
            # deno 는 표준 sha256sum 이 아니라 PowerShell Format-List 형식("Hash : <HEX>")을 올린다
            $dsum = Fetch-Text "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip.sha256sum"
            $dnExpect = Get-Sha256FromText $dsum
          } catch { Write-Host "  ⚠ deno 체크섬 조회 실패(검증 생략): $($_.Exception.Message)" }
          if ($dnExpect) { Assert-Sha256 "deno.zip" $dnExpect "deno" }
          else { Write-Host "  ⚠ deno 체크섬을 해석하지 못함(검증 생략)" }
          Expand-Archive -Path "deno.zip" -DestinationPath "deno_tmp" -Force
          Copy-Item "deno_tmp/deno.exe" "$tools/deno.exe" -Force

          Write-Host "Downloaded tools:"
          Get-ChildItem $tools -Filter *.exe | Format-Table Name, Length

      # 3.5) MSVC 개발 환경 — Ninja 가 cl.exe / rc.exe / link.exe 를 PATH 에서 찾도록.
      #      install-qt-action 는 vcvars 를 안 걸어줘서 이 단계 없으면 Ninja 가 컴파일러를 못 찾음.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # 4) CMake configure + build (Release)
      - name: Configure + Build
        shell: pwsh
        run: |
          cmake -B build_win -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DAPP_NAME=Predormition `
            -DAPP_ID=com.predormition.app
          cmake --build build_win -j

      # 5) windeployqt — Qt DLL 자동 번들 + 리소스 복사
      - name: Deploy
        shell: pwsh
        run: |
          $dist = "dist/win"   # ★ 짧게 — Windows MAX_PATH(260자) 여유 확보(python_env 의 깊은 경로가 한계에 걸림)
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # exe 찾기 (Predormition.exe / 구 이름 fallback)
          $exe = Get-ChildItem -Path "build_win" -Filter "*.exe" -Recurse | Where-Object { $_.Name -match "Predormition|Chernobyl|Miyo" } | Select-Object -First 1
          Copy-Item $exe.FullName "$dist/Predormition.exe" -Force

          # Qt DLL 번들 (--compiler-runtime: VC++ 런타임 DLL 동봉 → 사용자 PC 에 VC redist 없어도 실행)
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime --no-system-d3d-compiler "$dist/Predormition.exe"
          # ★ 종료 코드 확인 — windeployqt 가 실패해도 조용히 지나가면 Qt DLL 이 빠진
          #   '실행조차 안 되는' 배포본이 그대로 릴리즈된다.
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 실패 (exit $LASTEXITCODE) — Qt 런타임이 불완전하므로 중단" }

          # ★ VC++ 런타임 DLL 실제 확인 — --compiler-runtime 이 vc_redist 설치본만 넣고
          #   DLL 은 안 넣는 경우가 있다. 그러면 VC redist 가 없는 깨끗한 PC 에서
          #   "VCRUNTIME140_1.dll 을 찾을 수 없어..." 로 앱이 아예 안 켜진다.
          if (-not (Test-Path "$dist/VCRUNTIME140.dll")) {
            $redist = $env:VCToolsRedistDir
            if ($redist -and (Test-Path "$redist/x64")) {
              $crt = Get-ChildItem "$redist/x64" -Filter "Microsoft.VC*.CRT" -Directory | Select-Object -First 1
              if ($crt) {
                Copy-Item "$($crt.FullName)/*.dll" $dist -Force
                Write-Host "  ✔ VC++ 런타임 DLL 직접 복사: $($crt.Name)"
              }
            }
          }
          if (Test-Path "$dist/VCRUNTIME140.dll") { Write-Host "  ✔ VCRUNTIME140.dll 확인" }
          else { Write-Host "  ⚠ VC++ 런타임 DLL 없음 — VC redist 미설치 PC 에서 실행 실패 가능" }
          # redist 설치본(.exe)은 배포본에 불필요 — 용량만 차지
          Remove-Item "$dist/vc_redist*.exe" -Force -ErrorAction SilentlyContinue

          # 리소스 복사
          if (Test-Path "resources/fonts") { Copy-Item "resources/fonts" "$dist/fonts" -Recurse -Force }
          if (Test-Path "resources/html")  { Copy-Item "resources/html"  "$dist/html"  -Recurse -Force }

          # 도구 복사
          #  ★ .exe 도구(yt-dlp/ffmpeg/ffprobe/rclone/exiftool)는 exe 루트로 — 앱이
          #    findBundledTool() = applicationDirPath()/<tool>.exe 및 --ffmpeg-location <exe_dir> 로 찾음.
          #    (이전: tools/ 하위로 복사 → 루트에서 못 찾아 YouTube/rclone 동작 안 함)
          #  ★ .py 데몬 스크립트만 tools/ 로 — bundledToolsDir() = <exe>/tools.
          New-Item -ItemType Directory -Force -Path "$dist/tools" | Out-Null
          Copy-Item "resources/tools/*.exe" "$dist/" -Force -ErrorAction SilentlyContinue
          Copy-Item "resources/tools/*.py"  "$dist/tools/" -Force -ErrorAction SilentlyContinue
          # exiftool 의 Perl 런타임 폴더는 exiftool.exe 와 같은 위치(루트)에 있어야 함
          if (Test-Path "resources/tools/exiftool_files")     { Copy-Item "resources/tools/exiftool_files"     "$dist/exiftool_files"     -Recurse -Force }
          # ★ SingleFile 확장 — 페이지 통째 캡쳐(트위터 realCapture / 사이트 미러)에 필수.
          #   windows 트리에는 없고 mac 트리에만 있어서 배포본에서 늘 빠져 있었다(무음 실패).
          $sfSrc = if (Test-Path "resources/tools/singlefile_extension") { "resources/tools/singlefile_extension" }
                   elseif (Test-Path "../mac/chernobyl/resources/tools/singlefile_extension") { "../mac/chernobyl/resources/tools/singlefile_extension" }
                   else { $null }
          if ($sfSrc) { Copy-Item $sfSrc "$dist/tools/singlefile_extension" -Recurse -Force; Write-Host "  ✔ SingleFile 확장 포함" }
          else { Write-Host "  ⚠ SingleFile 확장 없음 — 페이지 통째 캡쳐 기능이 비활성" }

          # ★ Python 환경 — Twitter/Bluesky 데몬(twikit/atproto)에 필수.
          #   bundle_python_win.bat 가 build_win/python_env 에 생성 → 앱은 <exe>/python_env/python.exe 를 찾으므로 dist 루트로 복사.
          if (Test-Path "build_win/python_env") {
            Copy-Item "build_win/python_env" "$dist/python_env" -Recurse -Force
            $pyMB = (Get-ChildItem "$dist/python_env" -Recurse | Measure-Object -Property Length -Sum).Sum/1MB
            Write-Host ("python_env bundled: {0:N1} MB" -f $pyMB)
          } else {
            Write-Host "WARN: build_win/python_env 없음 — Twitter/Bluesky 는 시스템 Python 필요"
          }

          # ★ python_env 검증 게이트 — bundle_python_win.bat 이 실패해도 exit 0 을 내서
          #   Python 이 없거나 패키지가 빠진 '반쪽 설치본' 이 그대로 릴리즈되곤 했다.
          #   여기서 실제로 import 해보고, 깨졌으면 빌드를 세운다.
          $pyExe = "$dist/python_env/python.exe"
          if (Test-Path $pyExe) {
            & $pyExe -c "import twikit, atproto, browser_cookie3; print('python_env OK')"
            if ($LASTEXITCODE -ne 0) { throw "python_env 가 불완전합니다(twikit/atproto/browser_cookie3 import 실패) — Twitter/Bluesky 가 동작하지 않는 설치본이므로 중단" }
          } else {
            throw "python_env 가 배포본에 없습니다 — Twitter/Bluesky 수집이 불가능한 설치본이므로 중단"
          }

          # exiftool.exe → exe 루트 (Windows 앱은 applicationDirPath()/exiftool.exe 탐색)
          if (Test-Path "resources/tools/exiftool.exe") { Copy-Item "resources/tools/exiftool.exe" "$dist/exiftool.exe" -Force }

          # ★ 산출물 검증 게이트 — 위 복사들은 대부분 -ErrorAction SilentlyContinue 라
          #   파일이 하나도 안 옮겨져도 빌드가 초록불로 끝난다. 그 결과 "켜지긴 하는데
          #   YouTube/캡쳐/폰트가 통째로 없는" 설치본이 릴리즈된 적이 있다.
          #   필수 산출물은 없으면 빌드를 세우고, 있으면 없어도 되는 것만 경고로 남긴다.
          $must = @{
            "Predormition.exe"   = "본체 실행 파일"
            "Qt6Core.dll"        = "Qt 런타임"
            "Qt6WebEngineCore.dll" = "WebEngine(캡쳐·UI) 런타임"
            # ★ WebEngine 은 DLL 만으론 못 뜬다 — 아래가 하나라도 빠지면 앱은 켜지지만
            #   UI 가 백지로 나오거나 캡쳐가 통째로 죽는다(예전에 실제로 겪은 무음 실패).
            "QtWebEngineProcess.exe" = "WebEngine 렌더러 프로세스"
            "html/index.html"    = "앱 UI"
            "yt-dlp.exe"         = "YouTube/니코동 다운로더"
            "ffmpeg.exe"         = "영상 병합/변환"
            # ★ Twitter/Bluesky 는 이 파이썬 데몬이 없으면 수집이 아예 안 된다.
            #   복사가 -ErrorAction SilentlyContinue 라 조용히 빠질 수 있어 게이트에 넣는다.
            "tools/twitter_daemon.py" = "Twitter 수집 데몬"
            "tools/bluesky_daemon.py" = "Bluesky 수집 데몬"
          }
          $missing = @()
          foreach ($k in $must.Keys) { if (-not (Test-Path "$dist/$k")) { $missing += "$k ($($must[$k]))" } }
          if ($missing.Count -gt 0) {
            throw "배포본에 필수 파일이 빠졌습니다 — 설치해도 동작하지 않으므로 중단:`n  - " + ($missing -join "`n  - ")
          }
          $should = @{ "resources/qtwebengine_resources.pak" = "WebEngine 리소스";
                       "resources/icudtl.dat" = "WebEngine 유니코드 데이터";
                       "exiftool.exe" = "EXIF 메타데이터"; "rclone.exe" = "NAS 백업";
                       "deno.exe" = "yt-dlp JS 런타임"; "fonts" = "한글 폰트";
                       "tools/singlefile_extension" = "페이지 통째 캡쳐" }
          foreach ($k in $should.Keys) {
            if (-not (Test-Path "$dist/$k")) { Write-Host "  ⚠ $k 없음 — $($should[$k]) 기능 비활성" }
          }
          Write-Host "  ✔ 필수 산출물 $($must.Count)종 모두 확인"

          # ★ MAX_PATH 게이트 — 설치 경로는 보통
          #   C:\Users\<이름>\AppData\Local\Programs\Predormition\ (약 60자) 이다.
          #   여기에 dist 안의 상대 경로가 더해져 260자를 넘으면 Inno 가 파일을 못 풀거나
          #   앱이 그 파일을 못 연다(python_env 의 깊은 경로가 늘 한계에 가깝다).
          $root = (Resolve-Path $dist).Path
          $longest = Get-ChildItem $dist -Recurse -File |
                     ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
                     Sort-Object Length -Descending | Select-Object -First 1
          $budget = 260 - 80   # 설치 경로 여유분 80자
          Write-Host ("  가장 긴 상대 경로: {0}자 (여유 한도 {1}자)" -f $longest.Length, $budget)
          if ($longest.Length -gt $budget) {
            throw "상대 경로가 너무 깁니다($($longest.Length)자 > $budget자): $longest`n설치 시 MAX_PATH(260자)를 넘겨 파일이 누락됩니다."
          }

          Write-Host "=== dist content ==="
          Get-ChildItem $dist -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "Total: {0:N1} MB" -f ($_.Sum/1MB) }

      # 6) Artifact 업로드 (폴더 zip — 포터블) — Actions 탭에서 다운로드
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Predormition-Windows-${{ github.sha }}
          path: windows/dist/win/
          retention-days: 14

      # 7) 단일 설치 파일 (Inno Setup) — dist 전체를 Predormition_Setup.exe 하나로 패키징
      - name: Build single-file installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }

          # ★ 버전 단일 출처 — 레포 루트 VERSION 을 읽어 설치본에 넘긴다.
          #   태그로 빌드할 때는 태그와 VERSION 이 같은지 확인한다. 다르면
          #   "v3.9.1 릴리즈인데 설치본은 3.9.0" 같은 불일치가 그대로 배포된다.
          $ver = (Get-Content "../VERSION" -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION 형식이 잘못됐습니다: '$ver'" }
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $tagVer = $ref -replace '^refs/tags/v', ''
            if ($tagVer -ne $ver) {
              throw "태그(v$tagVer)와 VERSION 파일($ver)이 다릅니다 — 릴리즈 버전 불일치이므로 중단"
            }
            Write-Host "  ✔ 태그 v$tagVer == VERSION $ver"
          }
          Write-Host "  설치본 버전: $ver"

          & $iscc "/DMyAppVersion=$ver" predormition.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
          Get-ChildItem installer_out | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}

      # 8) 설치 exe 업로드 — Actions Artifacts 에서 단일 파일로 다운로드
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Predormition-Setup-${{ github.sha }}
          path: windows/installer_out/Predormition_Setup.exe
          retention-days: 14

      # 9) GitHub Release — v* 태그 push 시 Predormition_Setup.exe 를 자산으로 올린다.
      #    ★ draft 로 만든다: 이 저장소는 '발행된 릴리즈 = immutable' 정책이라 발행 후에는
      #      자산을 추가할 수 없다. mac 은 CI 가 아니라 로컬에서 빌드·서명하므로
      #      (Predormition.dmg) 초안에 나중에 올린 뒤 함께 발행해야 두 플랫폼이 한 릴리즈에 담긴다.
      #      → 배포 순서: 태그 push → (CI) 초안 생성 → mac DMG 업로드 → 릴리즈 발행.
      - name: Publish GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/installer_out/Predormition_Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
